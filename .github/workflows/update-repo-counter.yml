name: Update repo counter

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you press "Run workflow" manually
  push:
    branches: [main]
    paths:
      - "scripts/generate_counter.py"
      - ".github/workflows/update-repo-counter.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build counter SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_counter.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/repo-counter.svg
          git diff --cached --quiet || (git commit -m "chore: update repo counter" && git push)
