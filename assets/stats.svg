<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 170" width="380" height="170" role="img" aria-label="github stats" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>github stats</title>
  <style>text { font-family: "JetBrains Mono", "Fira Code", Consolas, "SF Mono", "Courier New", monospace; }</style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="380" height="170" fill="#0a090d"/>
  <rect x=".5" y=".5" width="379" height="169" fill="url(#grid)" stroke="#2b2733"/>
  <rect x="20" y="20" width="8" height="8" fill="#ff6f9d" shape-rendering="crispEdges"/>
  <text x="36" y="28" font-size="15" font-weight="700" fill="#ff8fb1">github stats</text>
  <text x="20" y="66" font-size="13" fill="#f6c9d8">public repos</text>
  <text x="360" y="66" text-anchor="end" font-size="16" font-weight="700" fill="#7fe8c0">25</text>
  <rect x="20" y="75" width="340" height="1" fill="#2b2733"/>
  <text x="20" y="92" font-size="13" fill="#f6c9d8">stars earned</text>
  <text x="360" y="92" text-anchor="end" font-size="16" font-weight="700" fill="#7fe8c0">1</text>
  <rect x="20" y="101" width="340" height="1" fill="#2b2733"/>
  <text x="20" y="118" font-size="13" fill="#f6c9d8">followers</text>
  <text x="360" y="118" text-anchor="end" font-size="16" font-weight="700" fill="#7fe8c0">5</text>
  <rect x="20" y="127" width="340" height="1" fill="#2b2733"/>
  <text x="20" y="144" font-size="13" fill="#f6c9d8">following</text>
  <text x="360" y="144" text-anchor="end" font-size="16" font-weight="700" fill="#7fe8c0">7</text>
</svg>
