<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 170" width="380" height="170" role="img" aria-label="top languages">
  <title>top languages</title>
  <style>text { font-family: "JetBrains Mono", "Fira Code", Consolas, "SF Mono", "Courier New", monospace; }</style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="380" height="170" fill="#0a090d"/>
  <rect x=".5" y=".5" width="379" height="169" fill="url(#grid)" stroke="#2b2733"/>
  <rect x="20" y="20" width="8" height="8" fill="#ff6f9d" shape-rendering="crispEdges"/>
  <text x="36" y="28" font-size="15" font-weight="700" fill="#ff8fb1">top languages</text>
  <text x="20" y="62" font-size="13" fill="#f6c9d8">C++</text>
  <rect x="130" y="52" width="170" height="10" fill="#2b0f1f" shape-rendering="crispEdges"/>
  <rect x="130" y="52" width="68" height="10" fill="#ff6f9d" shape-rendering="crispEdges"/>
  <text x="360" y="62" text-anchor="end" font-size="12" fill="#8a8592">40%</text>
  <text x="20" y="84" font-size="13" fill="#f6c9d8">Python</text>
  <rect x="130" y="74" width="170" height="10" fill="#2b0f1f" shape-rendering="crispEdges"/>
  <rect x="130" y="74" width="51" height="10" fill="#7fe8c0" shape-rendering="crispEdges"/>
  <text x="360" y="84" text-anchor="end" font-size="12" fill="#8a8592">30%</text>
  <text x="20" y="106" font-size="13" fill="#f6c9d8">Java</text>
  <rect x="130" y="96" width="170" height="10" fill="#2b0f1f" shape-rendering="crispEdges"/>
  <rect x="130" y="96" width="34" height="10" fill="#ffa3c1" shape-rendering="crispEdges"/>
  <text x="360" y="106" text-anchor="end" font-size="12" fill="#8a8592">20%</text>
  <text x="20" y="128" font-size="13" fill="#f6c9d8">HTML</text>
  <rect x="130" y="118" width="170" height="10" fill="#2b0f1f" shape-rendering="crispEdges"/>
  <rect x="130" y="118" width="17" height="10" fill="#c9a7ff" shape-rendering="crispEdges"/>
  <text x="360" y="128" text-anchor="end" font-size="12" fill="#8a8592">10%</text>
</svg>
