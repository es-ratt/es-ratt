<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Esrat's live monitor</title>
  <desc id="d">A pixel-art monitor with a smiling face that says: Hi, I'm Esrat. Software Engineering student at Daffodil International University, founder at Codemic.</desc>

  <style>
    text { font-family: "JetBrains Mono", "Fira Code", Consolas, "SF Mono", "Courier New", monospace; }

    /* base = final layout (also what reduced-motion users see) */
    .face  { transform: translate(325px, 116px); transform-origin: 0 0; animation: face 18s infinite; }
    .txt   { animation: fade 18s infinite; }
    .cv    { transform: scaleX(0); transform-box: fill-box; transform-origin: 100% 50%; }
    .t1    { animation: t1 18s infinite; }
    .t2    { animation: t2 18s infinite; }
    .t3    { animation: t3 18s infinite; }
    .t4    { animation: t4 18s infinite; }

    .eyes  { animation: hop 1.4s steps(1) infinite; }
    .blush { animation: pulse 2.8s ease-in-out infinite; }
    .tip   { animation: blink 1.2s steps(1) infinite; }
    .led   { animation: blink 2s steps(1) infinite; }
    .cur   { animation: blink .9s steps(1) infinite; }
    .tw    { animation: tw 3s steps(1) infinite; }

    @keyframes blink { 50% { opacity: 0; } }
    @keyframes tw    { 0%, 60% { opacity: .9; } 70%, 100% { opacity: .12; } }
    @keyframes hop   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulse { 50% { opacity: .2; } }

    /* 0-3s: big smiling face. 3-4s: face moves up. then the text types line by line. */
    @keyframes face {
      0%, 16%   { transform: translate(280px, 175px) scale(1.6); animation-timing-function: ease-in-out; }
      22%, 92%  { transform: translate(325px, 116px) scale(1); }
      98%, 100% { transform: translate(280px, 175px) scale(1.6); }
    }
    @keyframes fade { 0%, 91% { opacity: 1; } 93%, 100% { opacity: 0; } }

    @keyframes t1 { 0%, 23% { transform: scaleX(1); animation-timing-function: steps(13, end); } 29%, 93% { transform: scaleX(0); } 93.5%, 100% { transform: scaleX(1); } }
    @keyframes t2 { 0%, 31% { transform: scaleX(1); animation-timing-function: steps(28, end); } 39%, 93% { transform: scaleX(0); } 93.5%, 100% { transform: scaleX(1); } }
    @keyframes t3 { 0%, 41% { transform: scaleX(1); animation-timing-function: steps(36, end); } 51%, 93% { transform: scaleX(0); } 93.5%, 100% { transform: scaleX(1); } }
    @keyframes t4 { 0%, 53% { transform: scaleX(1); animation-timing-function: steps(17, end); } 60%, 93% { transform: scaleX(0); } 93.5%, 100% { transform: scaleX(1); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".28"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
  </defs>

  <!-- page + frame -->
  <rect width="800" height="540" fill="#0a090d"/>
  <rect x="100.5" y="20.5" width="600" height="440" fill="url(#grid)" stroke="#2b2733"/>
  <g fill="#4a4550" font-size="14" text-anchor="middle">
    <text x="114" y="38">+</text><text x="686" y="38">+</text>
    <text x="114" y="452">+</text><text x="686" y="452">+</text>
  </g>

  <!-- sparkles -->
  <g fill="#ff6f9d" shape-rendering="crispEdges">
    <rect class="tw" x="118" y="120" width="3" height="3"/>
    <rect class="tw" x="140" y="300" width="3" height="3" style="animation-delay:-1s"/>
    <rect class="tw" x="122" y="420" width="3" height="3" style="animation-delay:-2s"/>
    <rect class="tw" x="680" y="92" width="3" height="3" style="animation-delay:-.5s"/>
    <rect class="tw" x="668" y="240" width="3" height="3" style="animation-delay:-1.5s"/>
    <rect class="tw" x="676" y="402" width="3" height="3" style="animation-delay:-2.5s"/>
    <rect class="tw" x="250" y="46" width="3" height="3" style="animation-delay:-.8s"/>
    <rect class="tw" x="560" y="52" width="3" height="3" style="animation-delay:-1.8s"/>
  </g>

  <!-- monitor -->
  <g shape-rendering="crispEdges">
    <!-- antenna -->
    <rect x="396" y="50" width="8" height="30" fill="#4a4a55"/>
    <rect class="tip" x="395" y="40" width="10" height="10" fill="#ff6f9d"/>

    <!-- bezel -->
    <rect x="150" y="90" width="500" height="300" fill="#3b3b45"/>
    <rect x="160" y="80" width="480" height="320" fill="#3b3b45"/>
    <rect x="160" y="80" width="480" height="8" fill="#5a5a66"/>
    <rect x="150" y="90" width="8" height="300" fill="#4d4d59"/>
    <rect x="160" y="392" width="480" height="8" fill="#26262e"/>
    <rect x="642" y="90" width="8" height="300" fill="#2c2c35"/>
    <rect x="176" y="104" width="448" height="270" fill="#17161c"/>

    <!-- chin details -->
    <rect x="186" y="384" width="24" height="4" fill="#5a5a66"/>
    <rect x="186" y="384" width="4" height="10" fill="#5a5a66"/>
    <rect class="led" x="606" y="382" width="10" height="10" fill="#7fe8c0"/>

    <!-- stand -->
    <rect x="360" y="400" width="80" height="22" fill="#34343d"/>
    <rect x="360" y="400" width="8" height="22" fill="#44444e"/>
    <rect x="300" y="422" width="200" height="12" fill="#4a4a55"/>
    <rect x="290" y="434" width="220" height="6" fill="#26262e"/>
  </g>

  <!-- screen -->
  <rect x="180" y="108" width="440" height="262" fill="#2b0f1f"/>

  <!-- face -->
  <g class="face" shape-rendering="crispEdges">
    <g class="eyes" fill="#ff6f9d">
      <rect x="30" y="0" width="10" height="10"/><rect x="20" y="10" width="10" height="10"/><rect x="40" y="10" width="10" height="10"/>
      <rect x="10" y="20" width="10" height="10"/><rect x="50" y="20" width="10" height="10"/>
      <rect x="110" y="0" width="10" height="10"/><rect x="100" y="10" width="10" height="10"/><rect x="120" y="10" width="10" height="10"/>
      <rect x="90" y="20" width="10" height="10"/><rect x="130" y="20" width="10" height="10"/>
    </g>
    <g class="blush" fill="#ff9ec0" opacity=".85">
      <rect x="0" y="40" width="20" height="10"/><rect x="130" y="40" width="20" height="10"/>
    </g>
    <g fill="#ff6f9d">
      <rect x="20" y="60" width="10" height="10"/><rect x="120" y="60" width="10" height="10"/>
      <rect x="30" y="70" width="10" height="10"/><rect x="110" y="70" width="10" height="10"/>
      <rect x="40" y="80" width="70" height="10"/>
    </g>
  </g>

  <!-- text (typed line by line) -->
  <g class="txt">
    <text x="400" y="245" text-anchor="middle" font-size="28" font-weight="700" fill="#ff8fb1">Hi, I'm Esrat</text>
    <text x="400" y="278" text-anchor="middle" font-size="15" fill="#f6c9d8">Software Engineering student</text>
    <text x="400" y="302" text-anchor="middle" font-size="15" fill="#f6c9d8">at Daffodil International University</text>
    <text x="400" y="330" text-anchor="middle" font-size="15" fill="#7fe8c0">founder @ Codemic</text>
    <text x="204" y="356" font-size="14" fill="#7fe8c0">&gt;</text>
    <rect class="cur" x="220" y="345" width="9" height="13" fill="#7fe8c0"/>

    <g fill="#2b0f1f">
      <rect class="cv t1" x="275" y="216" width="250" height="38"/>
      <rect class="cv t2" x="268" y="263" width="264" height="21"/>
      <rect class="cv t3" x="232" y="287" width="336" height="21"/>
      <rect class="cv t4" x="318" y="315" width="164" height="21"/>
    </g>
  </g>

  <!-- CRT overlay -->
  <rect x="180" y="108" width="440" height="262" fill="url(#scan)"/>
  <rect x="180" y="108" width="440" height="262" fill="url(#vig)"/>

  <!-- status -->
  <text x="400" y="495" text-anchor="middle" font-size="13" letter-spacing="2" fill="#7fe8c0">[ ✓ ONLINE ]</text>
  <text x="400" y="520" text-anchor="middle" font-size="13" fill="#8a8592">esrat is online and building things</text>
</svg>
