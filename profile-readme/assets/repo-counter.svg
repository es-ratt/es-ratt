<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" width="360" height="110" role="img" aria-label="Public repositories: 7">
  <title>Public repositories: 7</title>
  <style>
    text { font-family: "JetBrains Mono", "Fira Code", Consolas, "SF Mono", "Courier New", monospace; }
    .live { animation: blink 1.4s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="360" height="110" fill="#0a090d"/>
  <rect x=".5" y=".5" width="359" height="109" fill="url(#grid)" stroke="#2b2733"/>

  <!-- pixel folder -->
  <g shape-rendering="crispEdges">
    <rect x="28" y="34" width="20" height="8" fill="#ff6f9d"/>
    <rect x="28" y="42" width="48" height="34" fill="#ff6f9d"/>
    <rect x="34" y="50" width="36" height="20" fill="#2b0f1f"/>
    <rect x="40" y="56" width="12" height="4" fill="#ffa3c1"/>
    <rect x="40" y="62" width="20" height="4" fill="#ffa3c1"/>
  </g>

  <text x="92" y="58" font-size="18" fill="#f6c9d8">repos</text>
  <text x="92" y="78" font-size="11" fill="#8a8592">public, counted live</text>

  <rect class="live" x="290" y="17" width="7" height="7" fill="#7fe8c0"/>
  <text x="332" y="24" text-anchor="end" font-size="11" fill="#7fe8c0">live</text>

  <g>
    <text x="330" y="80" text-anchor="end" font-size="54" font-weight="700" fill="#ff6f9d" opacity="0">1<animate attributeName="opacity" calcMode="discrete" dur="8.0s" repeatCount="indefinite" values="1;0;0" keyTimes="0;0.04286;1"/></text>
    <text x="330" y="80" text-anchor="end" font-size="54" font-weight="700" fill="#ff6f9d" opacity="0">2<animate attributeName="opacity" calcMode="discrete" dur="8.0s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.04286;0.08571;1"/></text>
    <text x="330" y="80" text-anchor="end" font-size="54" font-weight="700" fill="#ff6f9d" opacity="0">3<animate attributeName="opacity" calcMode="discrete" dur="8.0s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.08571;0.12857;1"/></text>
    <text x="330" y="80" text-anchor="end" font-size="54" font-weight="700" fill="#ff6f9d" opacity="0">4<animate attributeName="opacity" calcMode="discrete" dur="8.0s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.12857;0.17143;1"/></text>
    <text x="330" y="80" text-anchor="end" font-size="54" font-weight="700" fill="#ff6f9d" opacity="0">5<animate attributeName="opacity" calcMode="discrete" dur="8.0s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.17143;0.21429;1"/></text>
    <text x="330" y="80" text-anchor="end" font-size="54" font-weight="700" fill="#ff6f9d" opacity="0">6<animate attributeName="opacity" calcMode="discrete" dur="8.0s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.21429;0.25714;1"/></text>
    <text x="330" y="80" text-anchor="end" font-size="54" font-weight="700" fill="#ff6f9d" opacity="1">7<animate attributeName="opacity" calcMode="discrete" dur="8.0s" repeatCount="indefinite" values="0;1;1" keyTimes="0;0.25714;1"/></text>
  </g>
</svg>
